       ?engine=gemini, azure or vieneu opens with that engine selected.

       ?key=saved stores both keys; ?tts=ok answers Test voice with a second of silence.

       opened before the extension loaded; ?page=settings is a tab that is not a web page.
       Serve with test/serve.py. -->
