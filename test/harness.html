<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Win Voice Over harness</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; }
    .caption-box { background: #000; color: #fff; padding: 8px; min-height: 40px; width: 480px; }
    video { width: 480px; background: #222; display: block; margin-bottom: 8px; }
    pre { background: #f4f4f4; padding: 8px; max-height: 360px; overflow: auto; }
  </style>
</head>
<body>
  <!--
    Runs the real extension/content.js against a fake chrome API and a fake speechSynthesis
    whose utterances take as long as real speech would. Serve with test/serve.py so the
    page gets the extension's CSP.
      ?mode=dom     captions rendered into the DOM, picked-selector path (default)
      ?mode=tracks  captions delivered through video.textTracks
      ?mode=ocr     subtitles burned into the video picture
  -->
  <video id="video" muted playsinline></video>
  <div class="caption-box"></div>
  <pre id="log"></pre>
  <script src="../extension/vendor/tesseract/tesseract.min.js"></script>
  <script src="../extension/ocr-engine.js"></script>
  <script src="harness.js"></script>
</body>
</html>
